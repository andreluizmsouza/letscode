<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Documentos - CEHAB-RJ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header">
        <h1>Controle de Documentos - CEHAB-RJ</h1>
        <p>Sistema de controle de saída de pastas para digitalização</p>
        <nav class="nav">
            <button class="nav-btn active" data-page="lista">Listar Pastas</button>
            <button class="nav-btn" data-page="registrar">Registrar Saída</button>
        </nav>
    </div>

    <div class="container">
        <!-- Página: Lista de Pastas -->
        <div id="page-lista" class="page active">
            <div class="card">
                <h2>Lista de Pastas</h2>
                <div id="loading" class="loading">Carregando...</div>
                <div id="error" class="error" style="display: none;"></div>
                <div id="lista-container"></div>
            </div>
        </div>

        <!-- Página: Registrar Saída -->
        <div id="page-registrar" class="page">
            <div class="card">
                <h2>Registrar Saída de Pasta</h2>
                <p style="color: #757575; margin-bottom: 20px;">
                    Preencha os dados da pasta que está sendo enviada para digitalização na NovaGM
                </p>
                <div id="form-error" class="error" style="display: none;"></div>
                <div id="form-success" class="success" style="display: none;"></div>

                <form id="form-saida">
                    <div class="form-group">
                        <label for="numero">Número da Pasta *</label>
                        <input type="text" id="numero" name="numero" required placeholder="Ex: P-2024-001">
                    </div>

                    <div class="form-group">
                        <label for="descricao">Descrição *</label>
                        <input type="text" id="descricao" name="descricao" required placeholder="Ex: Contratos de locação 2024">
                    </div>

                    <div class="form-group">
                        <label for="tipoDocumento">Tipo de Documento *</label>
                        <select id="tipoDocumento" name="tipoDocumento" required>
                            <option value="Contrato">Contrato</option>
                            <option value="Termo">Termo</option>
                            <option value="Processo">Processo</option>
                            <option value="Relatório">Relatório</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="quantidadeDocumentos">Quantidade de Documentos *</label>
                        <input type="number" id="quantidadeDocumentos" name="quantidadeDocumentos" required min="1" placeholder="Ex: 50">
                    </div>

                    <div class="form-group">
                        <label for="responsavelSaida">Responsável pela Saída *</label>
                        <input type="text" id="responsavelSaida" name="responsavelSaida" required placeholder="Nome do responsável">
                    </div>

                    <div class="form-group">
                        <label for="observacoes">Observações</label>
                        <textarea id="observacoes" name="observacoes" placeholder="Informações adicionais (opcional)"></textarea>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">Registrar Saída</button>
                        <button type="button" class="btn btn-secondary" onclick="navegarPara('lista')">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Página: Detalhes da Pasta -->
        <div id="page-detalhes" class="page">
            <div class="card">
                <h2>Detalhes da Pasta</h2>
                <div id="detalhes-container"></div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
