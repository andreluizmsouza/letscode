services:
  # Backend API
  - type: web
    name: cehab-controle-documentos-api
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: cd backend && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cehab-documentos-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  # Frontend
  - type: web
    name: cehab-controle-documentos-web
    env: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_ENV
        value: production
    routes:
      - type: rewrite
        source: /api/*
        destination: https://cehab-controle-documentos-api.onrender.com/api/*

databases:
  - name: cehab-documentos-db
    plan: free
    databaseName: cehab_documentos
    user: cehab_user
